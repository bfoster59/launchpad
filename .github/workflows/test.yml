name: Tests

on:
  push:
    branches: ['fix/central-workspace*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_audit_omarchy.py'
